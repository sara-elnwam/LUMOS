name: lumos
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.0
  intl: ^0.20.2  # <--- Update this line here
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4

  # ── TTS / STT ─────────────────────────────────────────
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  http: ^1.2.0

  vibration: ^2.0.0
  audioplayers: ^5.2.1
  sensors_plus: ^4.0.2
  shake: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# This ensures version consistency for sensors
dependency_overrides:
  sensors_plus: ^4.0.2

flutter:
  generate: false
  uses-material-design: true
  assets:
    - assets/images/