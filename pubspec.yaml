name: lumos
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: false
  uses-material-design: true
  assets:
    - assets/images/splash.png
    - assets/images/male_3d_icon.png
    - assets/images/female_3d_icon.png
    - assets/images/lumos_devices.png